<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Hostel Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl w-full max-w-md shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    <form id="registerForm" class="space-y-4">
        <input type="text" id="name" placeholder="Full Name"
            class="w-full border p-3 rounded-lg" required>

        <input type="email" id="email" placeholder="Email"
            class="w-full border p-3 rounded-lg" required>

        <input type="password" id="password" placeholder="Password"
            class="w-full border p-3 rounded-lg" required>

        <select id="role" class="w-full border p-3 rounded-lg">
            <option value="student">Student</option>
            <option value="warden">Warden</option>
        </select>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
            Register
        </button>
    </form>

    <p class="text-sm text-center mt-4">
        Already have an account?
        <a href="login.html" class="text-blue-600 font-semibold">Login</a>
    </p>

    <p id="message" class="text-center text-sm mt-3"></p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    const response = await fetch("http://127.0.0.1:5000/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email, password, role })
    });

    const data = await response.json();

    if(response.ok){
        document.getElementById("message").innerHTML =
            "<span class='text-green-600 font-bold'>Registration successful! Redirecting...</span>";

        setTimeout(()=>{
            window.location.href = "login.html";
        }, 1500);
    } else {
        document.getElementById("message").innerHTML =
            "<span class='text-red-600'>" + data.error + "</span>";
    }
});
</script>

</body>
</html>
